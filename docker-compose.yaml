services:

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec puma -C config/puma.rb -b tcp://0.0.0.0:3000
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://spree:password@postgres:5432/spree_development
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/rails
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  sidekiq:
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec sidekiq
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://spree:password@postgres:5432/spree_development
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/rails
    depends_on:
      - postgres
      - redis

volumes:
  postgres:
  redis:
